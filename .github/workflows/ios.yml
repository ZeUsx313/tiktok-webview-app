name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build unsigned IPA (Expo prebuild + xcodebuild)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci || npm install

      - name: Expo prebuild (iOS)
        run: npx expo prebuild -p ios --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Patch fmt for new Xcode consteval strictness (Xcode 26)
        run: |
          # fmt 11.0.2 (from RN 0.81) uses FMT_STRING() in format-inl.h which
          # fails consteval checks on Apple clang shipped with Xcode 26.
          # Replacing FMT_STRING("...") with plain literals is behavior-identical.
          F="ios/Pods/fmt/include/fmt/format-inl.h"
          sed -i '' -E 's/FMT_STRING\(("[^"]*")\)/\1/g' "$F"
          echo "Remaining FMT_STRING occurrences (should be 0):"
          grep -c 'FMT_STRING' "$F" || true

      - name: Archive (no code signing)
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WS%.xcworkspace}"
          echo "Workspace: $WS | Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry TikTokWeb-unsigned.ipa Payload
          ls -lh TikTokWeb-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokWeb-iOS-unsigned-IPA
          path: TikTokWeb-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
